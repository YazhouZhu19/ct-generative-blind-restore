measurement_candidates:
  - name: APR-RD
    venue: AAAI 2025
    role: correlated-real-noise self-supervised denoising
    selected_for_local_adaptation: true
    note: The runnable pipeline borrows adjacent-pixel replacement, but is not the full paper implementation.
  - name: Blind2Sound
    venue: ICCV 2025
    role: self-supervised blind denoising without residual noise
    selected_for_local_adaptation: false
    note: Official training code is dataset/CUDA-oriented; requires CT-domain validation before measurement use.
  - name: AP-BSN
    venue: CVPR 2022
    role: asymmetric pixel-shuffle blind-spot denoising for correlated real noise
    selected_for_local_adaptation: false
    note: Official checkpoints target natural-camera sRGB datasets, not 16-bit CT.

generative_candidates:
  - name: FoundIR-v2
    venue: CVPR 2026
    role: generative all-in-one image restoration foundation model
    selected_for_measurement: false
    note: Requires SDXL/LLaVA checkpoints and one or two CUDA GPUs; natural-image prior may hallucinate layers.
  - name: Diffusion X-ray denoising
    venue: MIDL 2024
    role: domain-trained diffusion denoising for planar X-ray
    selected_for_measurement: false
    note: Promising when trained on matched X-ray physics/noise; not a zero-shot replacement for industrial CT calibration.

preserved_profiles:
  - name: v20-measurement-safe-tv-postprocess
    entrypoint: app/measurement_safe_postprocess.py
    input: v19 measurement-invariant zoned result plus v16 non-generated structural carrier
    retained_generation: v17 bounded-residual generative pixels already accepted through v18 and v19
    generator_executed_in_v20: false
    postprocess: seven-candidate search over amplitude-capped low-strength Chambolle-TV residuals in eroded soft-gated central, endpoint-exterior-fog, and flat-background zones
    selected_candidate: tv_balanced_strong_post
    selected_region_parameters: central tv12/0.40, endpoint-exterior-fog tv12/0.55, flat-background tv12/0.50, stack 0.00
    soft_gate: explicit one-pixel exterior zero padding plus an 8 px distance-transform smoothstep ramp; zero outside support and on the first inside contour
    uint16_locks: complete lamella/interlayer stacks, measurement-operator support, endpoint envelope, configured central ROI border/ring, and strong edges
    invariance: every-row transverse width, direct 100-lamella/98-interlayer geometry equality, topology, endpoint, length, configured-ROI fixed-line tracking, local SSIM/gradient fidelity, allowed-write and seam audits, clipping, global SSIM, and write/read audits
    noise_evidence: complementary fixed-support high-frequency RMS and Haar-detail mean-absolute proxies; no-reference and not independent proof of denoising accuracy
    supplied_image_validation:
      fixed_writable_hf_rms_reduction_percent: {central: 1.6893412, endpoint_exterior_fog: 0.6310707, flat_background: 5.1796276}
      fixed_writable_haar_detail_reduction_percent: {central: 2.4734208, endpoint_exterior_fog: 0.6879911, flat_background: 7.1662980}
      wider_v19_operator_reduction_percent: {central: 1.2454041, endpoint_exterior_fog: 0.0137632, flat_background: 0.5186381}
      direct_geometry_rows: {lamella: 100, interlayer: 98, maximum_absolute_drift_px: 0.0}
      changed_pixels: 88375
      changed_outside_writable_support: 0
      seam_absolute_delta_dn: {p95: 1, maximum: 7}
      changed_pixel_absolute_delta_dn: {p99: 66, maximum: 118}
      ssim_vs_v19: 0.9999943457
    analytic_renderer_pixel_writeback: false
    spatial_transform: none
    resampling: none
    sharpening: false
    contrast_remapping: false
    status: measurement candidate; requires calibrated multi-image validation
    warning: V20 adds no generated pixels, but retained v17 pixels remain; the non-generated v16 carrier and exported numeric constraints remain authoritative.
  - name: v19-measurement-invariant-zoned-restoration
    entrypoint: app/structure_anchored_multiregion_denoise.py
    input: v18 constrained-detail result plus v16 non-generated structural carrier
    retained_generation: v17 bounded-residual generative pixels already accepted by v18
    postprocess: independent zero-phase residual cleanup for axial lamella/interlayer stacks, central solid, endpoint-exterior fog, and low-structure background
    hard_anchor: exact same-coordinate v18 endpoint-envelope pixels
    invariance: uint16 topology, endpoint, length, aggregate FWHM, every-third-row FWHM, edge/detail, regional-noise, and SSIM audits
    rollback: every unsafe lamella and adjacent interlayer is restored to exact v18 pixels; excessive rollback is rejected
    analytic_renderer_pixel_writeback: false
    spatial_transform: none
    resampling: none
    status: measurement candidate; requires calibrated multi-image validation
    warning: Generated v17 pixels remain present; the non-generated v16 carrier and exported numeric constraints remain authoritative.
  - name: v18-clean-boundary-detail-preserving-fusion
    entrypoint: app/constrained_detail_fusion.py
    input: v17 structure-conditioned result plus v16 structural carrier
    constraint_role: v11-style finite-width boundary, endpoint, interlayer, and row-wise width audit fields
    postprocess: zero-phase symmetric edge enhancement plus eroded-interlayer residual shrinkage
    rollback: every regressing lamella and adjacent interlayer is restored to exact v17 pixels
    analytic_renderer_pixel_writeback: false
    spatial_transform: none
    status: measurement candidate; requires calibrated multi-image validation
    warning: Generated v17 pixels remain present; exported constraints and v16 remain authoritative.
  - name: v17-structure-carrier-conditioned-diffusion
    entrypoint: app/structure_conditioned_diffusion.py
    input: v16 structural carrier plus geometry fields, uncertainty, and a visual proposal
    generator: bounded-residual conditional DDIM with a compact structure adapter
    training_constraints: carrier confidence, x/y edges, width and endpoint projections, finite-width boundary field, interlayers, and midscale axial detail
    sampling_constraints: carrier-centered residual cap, boundary/endpoint protection, zero-phase cleanup, and independent v15/v16 audit
    selected_generated_residual_strength: 0.85
    status: measurement candidate; not a replacement for the calibrated v16 carrier
    warning: Generated pixels are present and require multi-image plus calibrated-phantom validation.
  - name: v16-measurement-quality
    entrypoint: app/measurement_quality_optimize.py
    input: v15 blind-denoised structure carrier
    generated_pixel_weight: 0.0
    selected_lamella_residual_strength: 0.0
    selected_central_nlm_strength: 0.92
    status: optional measurement-quality refinement after v15
    warning: The v15 carrier remains the immutable audit baseline.
  - name: v15-dual-output
    entrypoint: app/run_v15_pipeline.py
    visual_profile: v13 with blind-guide detail weight 0.90
    measurement_pixel_source: same-coordinate blind-denoised guide only
    generated_pixel_weight_in_measurement_output: 0.0
    spatial_transform_after_guide: none
    status: recommended when downstream lamella/interlayer measurement is required
    warning: Physical measurements still require calibrated pixel size and scanner PSF/MTF validation.
  - name: v11-stable
    entrypoint: app/run_v11_pipeline.py
    configuration: config/v11_profile.json
    geometry_guide: registered blind-denoised image
    direct_guide_texture_weight: 0.0
    status: preserved generative visual workflow
    warning: Generated pixels are visual-only and not metrology-certified.
