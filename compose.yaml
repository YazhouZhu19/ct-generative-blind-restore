x-cpu-build: &cpu-build
  context: .
  dockerfile: Dockerfile.cpu

x-data-volumes: &data-volumes
  - ./input:/data/input:ro
  - ./output:/data/output

services:
  enhance:
    build: *cpu-build
    image: ct-generative-blind-restore:focused-cpu
    volumes: *data-volumes
    command:
      - --source
      - /data/input/source_16bit.tif
      - --generated
      - /data/input/generative_candidate.png
      - --guide
      - /data/input/measurement_guide_16bit.tif
      - --outdir
      - /data/output
      - --geometry-config
      - /workspace/config/reference_geometry.json
      - --overwrite

  enhance-auto-guide:
    profiles: ["train-guide"]
    build: *cpu-build
    image: ct-generative-blind-restore:focused-cpu
    volumes: *data-volumes
    command:
      - --source
      - /data/input/source_16bit.tif
      - --generated
      - /data/input/generative_candidate.png
      - --outdir
      - /data/output
      - --geometry-config
      - /workspace/config/reference_geometry.json
      - --blind-iterations
      - "600"
      - --blind-device
      - cpu
      - --overwrite

  tests:
    build: *cpu-build
    image: ct-generative-blind-restore:focused-cpu
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    command: []
